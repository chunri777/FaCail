<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FaCail</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="FaCail navigation">
        <div class="brand">
          <span class="brand-mark">F</span>
          <div>
            <strong>FaCail</strong>
            <span>个人 A 股复盘</span>
          </div>
        </div>
        <nav class="nav">
          <button class="nav-item active" data-view="overview">今日总览</button>
          <button class="nav-item" data-view="candidates">今日候选</button>
          <button class="nav-item" data-view="holdings">我的持仓</button>
          <button class="nav-item" data-view="review">今日复盘</button>
          <button class="nav-item" data-view="watchlist">观察池</button>
        </nav>
        <p class="boundary">仅用于个人规则复盘，不构成投资建议。</p>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Mock Provider</p>
            <h1 id="view-title">今日总览</h1>
          </div>
          <div class="date-pill" id="trade-date">--</div>
        </header>

        <section class="view active" id="overview"></section>
        <section class="view" id="candidates"></section>
        <section class="view" id="holdings"></section>
        <section class="view" id="review"></section>
        <section class="view" id="watchlist"></section>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
